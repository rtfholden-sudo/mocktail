# Minimal main-tree Flatpak build for forks.
#
# This workflow exists because GitHub disables Actions on forks by default and
# the inherited workflows (ci.yml, packages.yml, flatpak.yml) run on broad
# events (pull requests, workflow_run chains, arena working branches) that
# waste compute on a fork. This one intentionally runs ONLY on:
#   - push to main          (automatic build of the main tree)
#   - workflow_dispatch     (manual trigger from the Actions tab)
# No schedules, no pull_request, no workflow_run, no branch lists.
#
# It builds an UNSIGNED x86_64 bundle and uploads it as a workflow artifact.
# It needs no secrets and only read permissions; signed releases stay with
# flatpak.yml on repositories where publishing is enabled.
name: Flatpak (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: flatpak-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak-main:
    name: Build x86_64 Flatpak from main
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Flatpak builder
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle (unsigned)
        shell: bash
        run: |
          set -Eeuo pipefail
          flatpak-builder \
            --arch=x86_64 \
            --jobs=4 \
            --user \
            --install-deps-from=flathub \
            --disable-rofiles-fuse \
            --force-clean \
            --default-branch=stable \
            --repo=repo \
            build-flatpak-ci \
            packaging/flatpak/space.bigrat.mocktail.json
          flatpak build-bundle \
            --arch=x86_64 \
            repo \
            Mocktail-x86_64.flatpak \
            space.bigrat.mocktail \
            stable
          ls -l Mocktail-x86_64.flatpak

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mocktail-x86_64-flatpak-main
          path: Mocktail-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14
